[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "scruffy-gpu"
version = "0.1.0"
description = "A small multi-agent GPU queue inside a multi-node Slurm allocation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Kiarash Jamali"}]
keywords = ["gpu", "hpc", "slurm", "scheduler", "queue"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.scripts]
scruffy = "scruffy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
